<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kanban — Flow</title>
<style>
  :root {
    --bg: #0f1117;
    --bg-grad: radial-gradient(1200px 600px at 10% -10%, #2a1b4d 0%, transparent 60%),
                radial-gradient(1000px 500px at 110% 0%, #0d2b3f 0%, transparent 55%);
    --surface: rgba(255, 255, 255, 0.045);
    --surface-solid: #1a1d27;
    --surface-2: rgba(255, 255, 255, 0.08);
    --border: rgba(255, 255, 255, 0.09);
    --text: #eef0f6;
    --text-muted: #9aa1b5;
    --accent: #7c5cff;
    --accent-strong: #9a82ff;
    --accent-soft: rgba(124, 92, 255, 0.16);
    --danger: #ff5d7a;
    --success: #34d399;
    --warn: #fbbf24;
    --shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
    --shadow-sm: 0 4px 14px rgba(0, 0, 0, 0.35);
    --radius: 14px;
  }
  [data-theme="light"] {
    --bg: #f4f5fa;
    --bg-grad: radial-gradient(1200px 600px at 10% -10%, #e7e1ff 0%, transparent 60%),
                radial-gradient(1000px 500px at 110% 0%, #d9ecff 0%, transparent 55%);
    --surface: rgba(255, 255, 255, 0.7);
    --surface-solid: #ffffff;
    --surface-2: rgba(0, 0, 0, 0.05);
    --border: rgba(0, 0, 0, 0.1);
    --text: #1c1f2b;
    --text-muted: #6b7280;
    --accent: #6a4bff;
    --accent-strong: #5a3bf0;
    --accent-soft: rgba(106, 75, 255, 0.12);
    --danger: #e5484d;
    --shadow: 0 12px 32px rgba(30, 30, 60, 0.16);
    --shadow-sm: 0 4px 14px rgba(30, 30, 60, 0.12);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
    background: var(--bg);
    background-image: var(--bg-grad);
    color: var(--text);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    transition: background 0.3s ease, color 0.3s ease;
  }

  /* ---------- Header ---------- */
  header {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 22px;
    backdrop-filter: blur(14px);
    background: color-mix(in srgb, var(--bg) 72%, transparent);
    border-bottom: 1px solid var(--border);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 1.15rem;
    letter-spacing: -0.02em;
  }
  .logo {
    width: 30px; height: 30px;
    border-radius: 9px;
    background: linear-gradient(135deg, var(--accent), #4aa8ff);
    display: grid; place-items: center;
    font-size: 0.9rem;
    box-shadow: 0 4px 14px var(--accent-soft);
  }
  .spacer { flex: 1; }

  .btn {
    appearance: none;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 10px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    transition: transform 0.12s ease, background 0.15s ease, border-color 0.15s ease;
  }
  .btn:hover { background: var(--surface); transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent), #4aa8ff);
    border-color: transparent;
    color: #fff;
    box-shadow: 0 4px 16px var(--accent-soft);
  }
  .btn-primary:hover { background: linear-gradient(135deg, var(--accent-strong), #4aa8ff); }
  .btn-icon {
    width: 38px; height: 38px;
    padding: 0;
    justify-content: center;
    border-radius: 10px;
    font-size: 1.05rem;
  }
  .btn-ghost { background: transparent; border-color: transparent; color: var(--text-muted); }
  .btn-ghost:hover { color: var(--text); background: var(--surface-2); }

  /* ---------- Barre de progression ---------- */
  .progress-wrap {
    padding: 12px 22px 0;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 0.85rem;
    color: var(--text-muted);
    font-weight: 600;
  }
  .progress-bar {
    flex: 1;
    height: 8px;
    border-radius: 99px;
    background: var(--surface-2);
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    border-radius: 99px;
    background: linear-gradient(90deg, var(--accent), #4aa8ff);
    transition: width 0.4s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .progress-label { white-space: nowrap; font-variant-numeric: tabular-nums; }

  /* ---------- Board ---------- */
  #board {
    flex: 1;
    display: flex;
    gap: 16px;
    padding: 18px 22px 26px;
    overflow-x: auto;
    align-items: flex-start;
  }

  .column {
    flex: 0 0 300px;
    display: flex;
    flex-direction: column;
    max-height: calc(100vh - 170px);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    backdrop-filter: blur(8px);
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .column.drag-over {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  .column-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 13px 14px 10px;
  }
  .column-title {
    font-weight: 700;
    font-size: 0.95rem;
    letter-spacing: -0.01em;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .count {
    flex: 0 0 auto;
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--text-muted);
    background: var(--surface-2);
    border-radius: 99px;
    padding: 2px 8px;
    font-variant-numeric: tabular-nums;
  }
  .done-badge {
    flex: 0 0 auto;
    width: 21px; height: 21px;
    padding: 0;
    border: 1.5px solid var(--border);
    border-radius: 50%;
    background: transparent;
    color: transparent;
    font-size: 0.72rem;
    line-height: 1;
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .done-badge:hover { border-color: var(--success); color: var(--success); }
  .done-badge.active {
    background: color-mix(in srgb, var(--success) 18%, transparent);
    border-color: var(--success);
    color: var(--success);
  }
  .head-actions {
    margin-left: auto;
    display: flex;
    gap: 2px;
    opacity: 0;
    transition: opacity 0.15s ease;
  }
  .column:hover .head-actions { opacity: 1; }
  .mini-btn {
    border: none;
    background: transparent;
    color: var(--text-muted);
    width: 26px; height: 26px;
    border-radius: 7px;
    cursor: pointer;
    font-size: 0.85rem;
    display: grid; place-items: center;
    transition: background 0.12s ease, color 0.12s ease;
  }
  .mini-btn:hover { background: var(--surface-2); color: var(--text); }
  .mini-btn.danger:hover { color: var(--danger); background: rgba(255, 93, 122, 0.12); }

  .card-list {
    flex: 1;
    overflow-y: auto;
    padding: 4px 10px 10px;
    display: flex;
    flex-direction: column;
    gap: 9px;
    min-height: 60px;
  }
  .card-list::-webkit-scrollbar { width: 8px; }
  .card-list::-webkit-scrollbar-thumb { background: var(--surface-2); border-radius: 99px; }

  .empty-hint {
    color: var(--text-muted);
    font-size: 0.8rem;
    text-align: center;
    padding: 18px 8px;
    border: 1.5px dashed var(--border);
    border-radius: 10px;
    opacity: 0.8;
  }

  .card {
    background: var(--surface-solid);
    border: 1px solid var(--border);
    border-radius: 11px;
    padding: 11px 12px;
    cursor: grab;
    box-shadow: var(--shadow-sm);
    transition: transform 0.12s ease, box-shadow 0.15s ease, border-color 0.15s ease, opacity 0.12s ease;
    position: relative;
  }
  .card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow);
    border-color: color-mix(in srgb, var(--accent) 45%, var(--border));
  }
  .card.dragging { opacity: 0.35; cursor: grabbing; }
  .card.drop-before::before, .card.drop-after::after {
    content: "";
    position: absolute;
    left: 6px; right: 6px;
    height: 3px;
    border-radius: 99px;
    background: var(--accent);
  }
  .card.drop-before::before { top: -6px; }
  .card.drop-after::after { bottom: -6px; }

  .card-title {
    font-weight: 650;
    font-size: 0.92rem;
    margin-bottom: 3px;
    word-break: break-word;
  }
  .card-desc {
    font-size: 0.82rem;
    color: var(--text-muted);
    line-height: 1.45;
    white-space: pre-wrap;
    word-break: break-word;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card-desc:empty { display: none; }
  .card-actions {
    position: absolute;
    top: 6px; right: 6px;
    display: flex;
    gap: 2px;
    opacity: 0;
    transition: opacity 0.15s ease;
  }
  .card:hover .card-actions { opacity: 1; }

  .add-card-btn {
    margin: 0 10px 10px;
    border: 1.5px dashed var(--border);
    background: transparent;
    color: var(--text-muted);
    border-radius: 10px;
    padding: 9px;
    cursor: pointer;
    font-size: 0.85rem;
    font-weight: 600;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .add-card-btn:hover { background: var(--surface-2); color: var(--text); border-color: var(--accent); }

  /* ---------- Modal ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    backdrop-filter: blur(4px);
    display: grid;
    place-items: center;
    z-index: 100;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity 0.18s ease, visibility 0s linear 0.18s;
  }
  .overlay.open { opacity: 1; visibility: visible; pointer-events: auto; transition: opacity 0.18s ease; }
  .modal {
    width: min(92vw, 430px);
    background: var(--surface-solid);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    box-shadow: var(--shadow);
    transform: translateY(10px) scale(0.98);
    transition: transform 0.18s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .overlay.open .modal { transform: translateY(0) scale(1); }
  .modal h2 {
    margin: 0 0 4px;
    font-size: 1.1rem;
    letter-spacing: -0.02em;
  }
  .modal .hint { color: var(--text-muted); font-size: 0.82rem; margin-bottom: 14px; }
  .field { margin-bottom: 12px; }
  .field label {
    display: block;
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--text-muted);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .field input, .field textarea {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    padding: 10px 12px;
    font-size: 0.92rem;
    font-family: inherit;
    resize: vertical;
  }
  .field input:focus, .field textarea:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .modal-footer {
    display: flex;
    justify-content: flex-end;
    gap: 9px;
    margin-top: 6px;
  }
  .btn-danger {
    background: color-mix(in srgb, var(--danger) 15%, transparent);
    border-color: color-mix(in srgb, var(--danger) 40%, transparent);
    color: var(--danger);
  }
  .btn-danger:hover { background: color-mix(in srgb, var(--danger) 24%, transparent); }

  kbd {
    font-family: inherit;
    font-size: 0.72rem;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-bottom-width: 2px;
    border-radius: 6px;
    padding: 1px 6px;
    color: var(--text-muted);
  }

  @media (max-width: 640px) {
    .column { flex-basis: 82vw; }
    .progress-wrap { flex-wrap: wrap; }
    .hide-sm { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="logo">▦</span>
    <span>Flow</span>
  </div>
  <span style="color:var(--text-muted); font-size:0.8rem;" class="hide-sm">
    Tableau Kanban — <kbd>Échap</kbd> pour fermer
  </span>
  <div class="spacer"></div>
  <button class="btn" id="theme-btn" title="Basculer le thème">🌙</button>
  <button class="btn btn-primary" id="new-column-btn">＋ Colonne</button>
</header>

<div class="progress-wrap">
  <span>Progression</span>
  <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
  <span class="progress-label" id="progress-label">0 / 0</span>
</div>

<main id="board"></main>

<div class="overlay" id="overlay">
  <div class="modal" role="dialog" aria-modal="true">
    <h2 id="modal-title"></h2>
    <p class="hint" id="modal-hint"></p>
    <div class="field" id="title-field">
      <label for="f-title">Titre</label>
      <input id="f-title" type="text" placeholder="Que faut-il faire ?" autocomplete="off">
    </div>
    <div class="field" id="desc-field">
      <label for="f-desc">Description <span style="text-transform:none;font-weight:500;">(optionnel)</span></label>
      <textarea id="f-desc" rows="3" placeholder="Détails, sous-tâches, lien…"></textarea>
    </div>
    <div class="modal-footer">
      <button class="btn btn-danger" id="modal-delete" style="display:none;">Supprimer</button>
      <div class="spacer"></div>
      <button class="btn btn-ghost" id="modal-cancel">Annuler</button>
      <button class="btn btn-primary" id="modal-save">Enregistrer</button>
    </div>
  </div>
</div>

<script>
"use strict";

/* ============ État ============ */
const STORAGE_KEY = "flow-kanban-v1";

function uid() {
  return (crypto.randomUUID && crypto.randomUUID()) ||
    "id-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8);
}

function defaultState() {
  const columns = [
    { id: uid(), title: "À faire", cards: [
      { id: uid(), title: "Préparer la démo", desc: "Lister les fonctionnalités clés à montrer." },
      { id: uid(), title: "Rédiger le brief", desc: "Objectifs, périmètre et critères de succès." },
      { id: uid(), title: "Planifier la revue", desc: "" },
    ]},
    { id: uid(), title: "En cours", cards: [
      { id: uid(), title: "Construire l'app Kanban", desc: "Un seul fichier HTML, zéro dépendance." },
    ]},
    { id: uid(), title: "Terminé", cards: [
      { id: uid(), title: "Choisir la stack", desc: "HTML + CSS + JS vanilla." },
      { id: uid(), title: "Créer le repo", desc: "" },
    ]},
  ];
  return { theme: "dark", doneColumnId: columns[columns.length - 1].id, columns };
}

let state = loadState();

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && Array.isArray(parsed.columns)) {
        if (parsed.doneColumnId === undefined && parsed.columns.length) {
          parsed.doneColumnId = parsed.columns[parsed.columns.length - 1].id;
        }
        return parsed;
      }
    }
  } catch (e) { /* localStorage indisponible : on repart de zéro */ }
  return defaultState();
}

function save() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) { /* quota / mode privé : on ignore */ }
}

/* ============ Rendu ============ */
const board = document.getElementById("board");
const overlay = document.getElementById("overlay");

function render() {
  renderTheme();
  renderProgress();
  board.innerHTML = "";
  state.columns.forEach((col) => board.appendChild(renderColumn(col)));
}

function renderProgress() {
  const total = state.columns.reduce((n, c) => n + c.cards.length, 0);
  const doneCol = state.columns.find((c) => c.id === state.doneColumnId);
  const done = doneCol ? doneCol.cards.length : 0;
  const pct = total ? Math.round((done / total) * 100) : 0;
  document.getElementById("progress-fill").style.width = pct + "%";
  document.getElementById("progress-label").textContent =
    (state.doneColumnId ? done : "—") + " / " + total + " · " + pct + "%";
}

function renderColumn(col) {
  const el = document.createElement("section");
  el.className = "column";
  el.dataset.columnId = col.id;

  const isDone = col.id === state.doneColumnId;
  const head = document.createElement("div");
  head.className = "column-head";
  head.innerHTML = `
    <span class="column-title"></span>
    <button class="done-badge${isDone ? " active" : ""}" data-action="set-done" data-col="${col.id}" aria-pressed="${isDone}" title="${isDone ? "Colonne de complétion — cliquer pour désactiver" : "Marquer comme colonne de complétion"}">✓</button>
    <span class="count">${col.cards.length}</span>
    <span class="head-actions">
      <button class="mini-btn" data-action="rename-column" data-col="${col.id}" title="Renommer">✎</button>
      <button class="mini-btn danger" data-action="delete-column" data-col="${col.id}" title="Supprimer">🗑</button>
    </span>`;
  head.querySelector(".column-title").textContent = col.title;

  const list = document.createElement("div");
  list.className = "card-list";
  list.dataset.columnId = col.id;
  list.addEventListener("dragover", onListDragOver);
  list.addEventListener("drop", onListDrop);
  list.addEventListener("dragleave", onListDragLeave);

  if (col.cards.length === 0) {
    const hint = document.createElement("div");
    hint.className = "empty-hint";
    hint.textContent = "Glissez une carte ici";
    list.appendChild(hint);
  } else {
    col.cards.forEach((card) => list.appendChild(renderCard(col.id, card)));
  }

  const addBtn = document.createElement("button");
  addBtn.className = "add-card-btn";
  addBtn.textContent = "＋ Ajouter une carte";
  addBtn.dataset.action = "add-card";
  addBtn.dataset.col = col.id;

  el.appendChild(head);
  el.appendChild(list);
  el.appendChild(addBtn);
  return el;
}

function renderCard(colId, card) {
  const el = document.createElement("article");
  el.className = "card";
  el.draggable = true;
  el.dataset.cardId = card.id;
  el.dataset.columnId = colId;

  el.innerHTML = `
    <div class="card-title"></div>
    <div class="card-desc"></div>
    <div class="card-actions">
      <button class="mini-btn" data-action="edit-card" data-card="${card.id}" title="Modifier">✎</button>
      <button class="mini-btn danger" data-action="delete-card" data-card="${card.id}" title="Supprimer">🗑</button>
    </div>`;
  el.querySelector(".card-title").textContent = card.title;
  el.querySelector(".card-desc").textContent = card.desc || "";

  el.addEventListener("dragstart", onCardDragStart);
  el.addEventListener("dragend", onCardDragEnd);
  el.addEventListener("dragover", onCardDragOver);
  el.addEventListener("drop", onCardDrop);
  el.addEventListener("dragleave", onCardDragLeave);
  return el;
}

/* ============ Mutations ============ */
function addColumn(title) {
  state.columns.push({ id: uid(), title, cards: [] });
  save(); render();
}

function renameColumn(id, title) {
  const col = state.columns.find((c) => c.id === id);
  if (!col) return;
  col.title = title;
  save(); render();
}

function deleteColumn(id) {
  state.columns = state.columns.filter((c) => c.id !== id);
  if (state.doneColumnId === id) {
    state.doneColumnId = state.columns.length ? state.columns[state.columns.length - 1].id : null;
  }
  save(); render();
}

function setDoneColumn(colId) {
  state.doneColumnId = state.doneColumnId === colId ? null : colId;
  save(); render();
}

function addCard(colId, { title, desc }) {
  const col = state.columns.find((c) => c.id === colId);
  if (!col) return;
  col.cards.push({ id: uid(), title, desc });
  save(); render();
}

function updateCard(colId, cardId, patch) {
  const col = state.columns.find((c) => c.id === colId);
  const card = col && col.cards.find((c) => c.id === cardId);
  if (!card) return;
  Object.assign(card, patch);
  save(); render();
}

function deleteCard(colId, cardId) {
  const col = state.columns.find((c) => c.id === colId);
  if (!col) return;
  col.cards = col.cards.filter((c) => c.id !== cardId);
  save(); render();
}

function moveCard(fromColId, cardId, toColId, index) {
  const from = state.columns.find((c) => c.id === fromColId);
  if (!from) return;
  const i = from.cards.findIndex((c) => c.id === cardId);
  if (i === -1) return;
  const [card] = from.cards.splice(i, 1);
  const to = state.columns.find((c) => c.id === toColId);
  if (!to) { from.cards.splice(i, 0, card); return; }
  if (fromColId === toColId && i < index) index--;
  to.cards.splice(index, 0, card);
  save(); render();
}

/* ============ Drag & drop ============ */
let dragState = null;

function onCardDragStart(e) {
  const card = e.currentTarget;
  dragState = { columnId: card.dataset.columnId, cardId: card.dataset.cardId };
  card.classList.add("dragging");
  if (e.dataTransfer) {
    e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData("text/plain", card.dataset.cardId);
  }
}

function onCardDragEnd(e) {
  e.currentTarget.classList.remove("dragging");
  dragState = null;
  document.querySelectorAll(".drag-over, .drop-before, .drop-after")
    .forEach((el) => el.classList.remove("drag-over", "drop-before", "drop-after"));
}

function onListDragOver(e) {
  if (!dragState) return;
  e.preventDefault();
  e.dataTransfer && (e.dataTransfer.dropEffect = "move");
  e.currentTarget.closest(".column").classList.add("drag-over");
  // Positionnement fin géré au niveau des cartes ; ici on nettoie.
  e.currentTarget.querySelectorAll(".drop-before, .drop-after")
    .forEach((el) => el.classList.remove("drop-before", "drop-after"));
}

function onListDragLeave(e) {
  if (e.currentTarget.contains(e.relatedTarget)) return;
  e.currentTarget.closest(".column").classList.remove("drag-over");
}

function onListDrop(e) {
  if (!dragState) return;
  e.preventDefault();
  const col = e.currentTarget.closest(".column");
  const targetColId = col.dataset.columnId;
  const targetCol = state.columns.find((c) => c.id === targetColId);
  moveCard(dragState.columnId, dragState.cardId, targetColId, targetCol.cards.length);
}

function onCardDragOver(e) {
  if (!dragState) return;
  e.preventDefault();
  e.stopPropagation();
  e.dataTransfer && (e.dataTransfer.dropEffect = "move");
  const card = e.currentTarget;
  const rect = card.getBoundingClientRect();
  const before = e.clientY < rect.top + rect.height / 2;
  card.classList.toggle("drop-before", before);
  card.classList.toggle("drop-after", !before);
  card.closest(".column").classList.add("drag-over");
}

function onCardDragLeave(e) {
  if (e.currentTarget.contains(e.relatedTarget)) return;
  e.currentTarget.classList.remove("drop-before", "drop-after");
}

function onCardDrop(e) {
  if (!dragState) return;
  e.preventDefault();
  e.stopPropagation();
  const card = e.currentTarget;
  const targetColId = card.dataset.columnId;
  const targetCol = state.columns.find((c) => c.id === targetColId);
  const idx = targetCol.cards.findIndex((c) => c.id === card.dataset.cardId);
  const rect = card.getBoundingClientRect();
  const after = e.clientY > rect.top + rect.height / 2;
  moveCard(dragState.columnId, dragState.cardId, targetColId, idx + (after ? 1 : 0));
}

/* ============ Modal ============ */
let modal = { mode: null, columnId: null, cardId: null };
let lastFocus = null;

function openModal(mode, opts = {}) {
  modal = { mode, ...opts };
  lastFocus = document.activeElement;
  const t = document.getElementById("modal-title");
  const hint = document.getElementById("modal-hint");
  const titleField = document.getElementById("title-field");
  const descField = document.getElementById("desc-field");
  const delBtn = document.getElementById("modal-delete");
  const saveBtn = document.getElementById("modal-save");
  const titleInput = document.getElementById("f-title");
  const descInput = document.getElementById("f-desc");

  titleInput.value = "";
  descInput.value = "";
  delBtn.style.display = "none";
  titleField.style.display = "block";
  descField.style.display = "block";
  saveBtn.textContent = "Enregistrer";
  saveBtn.className = "btn btn-primary";

  if (mode === "card") {
    t.textContent = opts.cardId ? "Modifier la carte" : "Nouvelle carte";
    hint.textContent = opts.cardId ? "Mettez à jour les informations." : "Ajoutez une tâche au tableau.";
    if (opts.cardId) {
      const col = state.columns.find((c) => c.id === opts.columnId);
      const card = col.cards.find((c) => c.id === opts.cardId);
      titleInput.value = card.title;
      descInput.value = card.desc || "";
      delBtn.style.display = "inline-flex";
    }
  } else if (mode === "column" || mode === "column-new") {
    t.textContent = mode === "column" ? "Renommer la colonne" : "Nouvelle colonne";
    hint.textContent = mode === "column" ? "Donnez un nom clair à cette étape." : "Ajoutez une étape à votre flux.";
    descField.style.display = "none";
    if (mode === "column") {
      const col = state.columns.find((c) => c.id === opts.columnId);
      titleInput.value = col.title;
    }
  } else if (mode === "column-delete") {
    const col = state.columns.find((c) => c.id === opts.columnId);
    t.textContent = "Supprimer la colonne ?";
    hint.textContent = "« " + col.title + " » et ses " + col.cards.length + " carte(s) seront supprimées définitivement.";
    titleField.style.display = "none";
    descField.style.display = "none";
    saveBtn.textContent = "Supprimer";
    saveBtn.className = "btn btn-danger";
  }

  overlay.classList.add("open");
  if (mode !== "column-delete") setTimeout(() => titleInput.focus(), 60);
}

function closeModal() {
  overlay.classList.remove("open");
  modal = { mode: null };
  if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
  lastFocus = null;
}

function submitModal() {
  if (modal.mode === "column-delete") {
    deleteColumn(modal.columnId);
    closeModal();
    return;
  }
  const title = document.getElementById("f-title").value.trim();
  const desc = document.getElementById("f-desc").value.trim();
  if (!title) {
    document.getElementById("f-title").focus();
    document.getElementById("f-title").style.borderColor = "var(--danger)";
    return;
  }
  if (modal.mode === "card") {
    if (modal.cardId) updateCard(modal.columnId, modal.cardId, { title, desc });
    else addCard(modal.columnId, { title, desc });
  } else if (modal.mode === "column") {
    renameColumn(modal.columnId, title);
  } else if (modal.mode === "column-new") {
    addColumn(title);
  }
  closeModal();
}

function deleteFromModal() {
  if (modal.mode === "card" && modal.cardId) {
    deleteCard(modal.columnId, modal.cardId);
  } else if (modal.mode === "column" && modal.columnId) {
    deleteColumn(modal.columnId);
  }
  closeModal();
}

/* ============ Thème ============ */
function renderTheme() {
  document.documentElement.dataset.theme = state.theme;
  document.getElementById("theme-btn").textContent = state.theme === "dark" ? "🌙" : "☀️";
}

function toggleTheme() {
  state.theme = state.theme === "dark" ? "light" : "dark";
  save(); render();
}

/* ============ Événements globaux ============ */
document.addEventListener("click", (e) => {
  const actionEl = e.target.closest("[data-action]");
  if (actionEl) {
    const action = actionEl.dataset.action;
    if (action === "add-card") openModal("card", { columnId: actionEl.dataset.col });
    else if (action === "edit-card") {
      const col = actionEl.closest(".column").dataset.columnId;
      openModal("card", { columnId: col, cardId: actionEl.dataset.card });
    } else if (action === "delete-card") {
      const col = actionEl.closest(".column").dataset.columnId;
      deleteCard(col, actionEl.dataset.card);
    } else if (action === "rename-column") {
      openModal("column", { columnId: actionEl.dataset.col });
    } else if (action === "delete-column") {
      openModal("column-delete", { columnId: actionEl.dataset.col });
    } else if (action === "set-done") {
      setDoneColumn(actionEl.dataset.col);
    }
    return;
  }
  if (e.target.closest("#overlay") && !e.target.closest(".modal")) closeModal();
});

document.getElementById("new-column-btn").addEventListener("click", () => openModal("column-new"));

document.getElementById("theme-btn").addEventListener("click", toggleTheme);
document.getElementById("modal-cancel").addEventListener("click", closeModal);
document.getElementById("modal-save").addEventListener("click", submitModal);
document.getElementById("modal-delete").addEventListener("click", deleteFromModal);

document.getElementById("f-title").addEventListener("input", (e) => {
  e.target.style.borderColor = "";
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && overlay.classList.contains("open")) {
    closeModal();
  }
});

document.getElementById("f-title").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    submitModal();
  }
});

/* ============ Démarrage ============ */
render();
</script>
</body>
</html>
